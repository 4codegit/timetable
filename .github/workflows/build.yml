name: Build Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installer (.exe + WebView2, with CP-SAT)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install LLVM (clang-cl) and NSIS
        run: choco install llvm nsis -y
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build OR-Tools Windows C++ binding
        shell: bash
        run: bash scripts/build_ortools_windows.sh
      - name: Build Windows amd64 with -tags ortools
        shell: bash
        env:
          CGO_ENABLED: "1"
          CC: "gcc"
          MSYS_NO_PATHCONV: "1"
        run: |
          export PATH="/c/mingw64/bin:$PATH:$(go env GOPATH)/bin"
          wails build -platform windows/amd64 -tags ortools
          cp third_party/ortools_win/ortools_csat.dll build/bin/
          [ -f third_party/ortools_win/bin/ortools.dll ] && cp third_party/ortools_win/bin/ortools.dll build/bin/ || echo "no separate ortools.dll (statically linked)"
          CRT=$(find "/c/Program Files/Microsoft Visual Studio" -type d -name "Microsoft.VC143.CRT" 2>/dev/null | head -1)
          if [ -n "$CRT" ]; then
            find "$CRT" -maxdepth 1 -name '*.dll' -exec cp {} build/bin/ ';' && echo "copied MSVC CRT from $CRT" || echo "CRT copy skipped"
          fi
      - name: Stage installer files
        shell: bash
        run: |
          mkdir -p windows/staging
          cp build/bin/timetable.exe windows/staging/timetable.exe
          cp third_party/ortools_win/ortools_csat.dll windows/staging/ortools_csat.dll
          [ -f build/bin/ortools.dll ] && cp build/bin/ortools.dll windows/staging/ortools.dll
          for d in vcruntime140.dll vcruntime140_1.dll msvcp140.dll msvcp140_1.dll msvcp140_codecvt_ids.dll; do
            [ -f "build/bin/$d" ] && cp "build/bin/$d" windows/staging/
          done
          curl -L "https://go.microsoft.com/fwlink/?linkid=2124701" -o windows/staging/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
      - name: Build NSIS installer
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          makensis -DREPOROOT="${{ github.workspace }}" windows/installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: timetable-windows-setup
          path: build/timetable-setup-x64.exe

  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install WebView build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev pkg-config build-essential wget dpkg-dev libglib2.0-bin file patchelf binutils python3
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build OR-Tools C++ binding
        run: bash scripts/build_ortools.sh
      - name: Build Linux amd64 with -tags ortools
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ortools/lib
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -platform linux/amd64 -tags "ortools webkit2_41"
          cp -L third_party/ortools/lib/libortools.so* build/bin/
          export LD_LIBRARY_PATH="build/bin:${LD_LIBRARY_PATH:-}"
          echo "== webkit soname linked =="
          ldd build/bin/timetable | grep -i webkit
          ldd build/bin/timetable | grep -qi 'webkit2gtk-4.1' || { echo "ERROR: binary not linked against webkit2gtk-4.1 (Fedora 40+ requires 4.1)"; exit 1; }
      - name: Build self-contained AppImage (linuxdeploy bundles all deps)
        run: |
          APP=build/AppDir
          rm -rf "$APP"
          mkdir -p "$APP/usr/bin" "$APP/usr/lib" "$APP/usr/lib/webkit2gtk-4.1/injected-bundle" \
                   "$APP/usr/share/applications" "$APP/usr/share/icons/hicolor/512x512/apps"
          cp build/bin/timetable "$APP/usr/bin/timetable"
          cp -L build/bin/libortools.so* "$APP/usr/lib/"
          cp scripts/timetable.desktop "$APP/usr/share/applications/timetable.desktop"
          cp scripts/timetable.desktop "$APP/timetable.desktop"
          cp scripts/appicon.png "$APP/usr/share/icons/hicolor/512x512/apps/timetable.png"
          cp scripts/appicon.png "$APP/timetable.png"
          # linuxdeploy + appimagetool are vendored (extracted) under tools/ so the build needs
          # no network access and no FUSE/AppImage runtime on the runner.
          cp scripts/linuxdeploy-plugin-gtk.sh /tmp/linuxdeploy-plugin-gtk
          chmod +x /tmp/linuxdeploy-plugin-gtk
          export PATH=/tmp:$PATH
          chmod +x "$PWD/tools/linuxdeploy/usr/bin/linuxdeploy" "$PWD/tools/appimagetool/AppRun" 2>/dev/null || true
          export LINUXDEPLOY="$PWD/tools/linuxdeploy/AppRun"
          export DEPLOY_GTK_VERSION=3
          export LD_LIBRARY_PATH="$APP/usr/lib:${LD_LIBRARY_PATH:-}"
          "$LINUXDEPLOY" --appdir "$APP" --executable "$APP/usr/bin/timetable" --plugin gtk
          # Bundle the Wayland/XKB client libs from the BUILD ENV so they stay consistent with the bundled
          # ubuntu libgtk/libwebkit. Mixing the host's libwayland-client with ubuntu libgtk crashes GTK init.
          for lib in /usr/lib/x86_64-linux-gnu/libwayland-client.so* \
                     /usr/lib/x86_64-linux-gnu/libwayland-cursor.so* \
                     /usr/lib/x86_64-linux-gnu/libxkbcommon.so* \
                     /usr/lib/x86_64-linux-gnu/libwayland-egl.so* \
                     /usr/lib/x86_64-linux-gnu/libwayland-server.so*; do
            for f in $lib; do
              [ -e "$f" ] && cp -L "$f" "$APP/usr/lib/" && echo "added $(basename "$f")"
            done
          done
          # WebKit helper processes (Network/Web/GPU) + injected bundle
          for f in /usr/libexec/webkit2gtk-4.1/WebKitNetworkProcess /usr/libexec/webkit2gtk-4.1/WebKitWebProcess /usr/libexec/webkit2gtk-4.1/WebKitGPUProcess /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitNetworkProcess /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitWebProcess /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitGPUProcess; do
            [ -f "$f" ] && cp -L "$f" "$APP/usr/lib/webkit2gtk-4.1/" && echo "bundled $f"
          done
          for f in /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/injected-bundle/libwebkit2gtkinjectedbundle.so /usr/lib64/webkit2gtk-4.1/injected-bundle/libwebkit2gtkinjectedbundle.so /usr/libexec/webkit2gtk-4.1/injected-bundle/libwebkit2gtkinjectedbundle.so; do
            [ -f "$f" ] && cp -L "$f" "$APP/usr/lib/webkit2gtk-4.1/injected-bundle/" && cp -L "$f" "$APP/usr/lib/webkit2gtk-4.1/" && echo "bundled injected bundle"
          done
          # Bundle a self-contained software Mesa (EGL/GL/GBM + llvmpipe/swrast) so WebKit can create an EGL
          # display and render WITHOUT the host GPU/Mesa. AppRun forces X11 EGL + software rendering, which
          # avoids the GBM/DRM path ("Could not create default EGL display: EGL_BAD_PARAMETER", white screen).
          MESA_LIBDIR=""
          for d in /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib; do [ -e "$d/libEGL.so.1" ] && MESA_LIBDIR="$d" && break; done
          echo "mesa libdir=$MESA_LIBDIR"
          mkdir -p "$APP/usr/lib/dri"
          for f in libEGL.so.1 libGL.so.1 libGLESv2.so.2 libgbm.so.1 libdrm.so.2 libglapi.so.0 libxshmfence.so.1 libvulkan.so.1; do
            [ -e "$MESA_LIBDIR/$f" ] && cp -L "$MESA_LIBDIR/$f" "$APP/usr/lib/" && echo "added mesa $f"
          done
          for f in "$MESA_LIBDIR"/libgallium*.so* "$MESA_LIBDIR"/libLLVM*.so*; do
            [ -e "$f" ] && cp -L "$f" "$APP/usr/lib/" && echo "added $(basename "$f")"
          done
          for f in "$MESA_LIBDIR"/dri/swrast_dri.so "$MESA_LIBDIR"/dri/kms_swrast_dri.so; do
            [ -e "$f" ] && cp -L "$f" "$APP/usr/lib/dri/" && echo "added $(basename "$f")"
          done
          # Close the full NEEDED library closure so nothing is missing at runtime
          # (linuxdeploy's static scan misses transitive deps such as libfribidi).
          close_libs() {
            local changed=1 r=0 soname found
            while [ $changed -eq 1 ] && [ $r -lt 15 ]; do
              changed=0; r=$((r+1))
              for elf in $(find "$APP" -type f \( -name '*.so*' -o -name timetable \)); do
                for soname in $(readelf -d "$elf" 2>/dev/null | awk '/NEEDED/{print $5}' | tr -d '[]'); do
                  case "$soname" in
                    libc.so*|ld-linux*|libm.so*|libpthread.so*|librt.so*|libdl.so*|libutil.so*|libresolv.so*|libnsl.so*|libLLVM*) continue;;
                  esac
                  if [ ! -e "$APP/usr/lib/$soname" ]; then
                    found=$(ls /usr/lib/x86_64-linux-gnu/$soname /usr/lib/$soname /lib/x86_64-linux-gnu/$soname 2>/dev/null | head -1) || true
                    if [ -n "$found" ]; then cp -L "$found" "$APP/usr/lib/" && echo "closure added $soname" && changed=1; fi
                  fi
                done
              done
            done
          }
          close_libs
          # WebKit hardcodes its helper/injected-bundle path at build time (e.g.
          # /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1) which does not exist on Fedora, so the
          # Network/Web/GPU child processes fail to spawn. Patch the embedded absolute path to a
          # fixed /tmp location and symlink it at runtime to the bundled helpers.
          python3 - <<'PY'
          import re
          p="build/AppDir/usr/lib/libwebkit2gtk-4.1.so.0"
          b=open(p,'rb').read()
          m=re.search(b'/usr/[^\x00]*?/webkit2gtk-4\\.1', b)
          assert m, "embedded webkit exec path not found in libwebkit"
          old=m.group(0)
          print("found embedded webkit path:", old.decode(), "len", len(old))
          new=b'/tmp/tw/webkit2gtk-4.1'
          assert len(new)<=len(old), (len(new), len(old))
          new_padded=new+b'\x00'*(len(old)-len(new))
          open(p,'wb').write(b.replace(old,new_padded))
          print("patched ->", new.decode())
          PY
          cat > "$APP/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="$HERE"
          for h in "$HERE"/apprun-hooks/*.sh; do
            [ -f "$h" ] && . "$h"
          done
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          export WEBKIT_EXEC_PATH="$HERE/usr/lib/webkit2gtk-4.1"
          # Force the X11 GDK backend and software rendering. This keeps WebKit on the X11 EGL platform
          # (not GBM/DRM), which works with the bundled software Mesa (llvmpipe) even without a GPU, and
          # avoids "Could not create default EGL display: EGL_BAD_PARAMETER" (white screen).
          export GDK_BACKEND=x11
          export LIBGL_ALWAYS_SOFTWARE=1
          export LIBGL_DRIVERS_PATH="$HERE/usr/lib/dri"
          export GALLIUM_DRIVERS_PATH="$HERE/usr/lib/dri"
          # Redirect WebKit's hardcoded helper/injected-bundle path (patched in libwebkit) to our bundled copy
          mkdir -p /tmp/tw
          ln -sfn "$HERE/usr/lib/webkit2gtk-4.1" /tmp/tw/webkit2gtk-4.1
          exec "$HERE/usr/bin/timetable" "$@"
          EOF
          chmod +x "$APP/AppRun" "$APP/usr/bin/timetable"
          "$PWD/tools/appimagetool/AppRun" "$APP" build/timetable-x86_64.AppImage
          ls -lh build/timetable-x86_64.AppImage
      - name: Verify AppImage on Fedora 40 (reproduces user's environment)
        run: |
          AI="$PWD/build/timetable-x86_64.AppImage"
          chmod +x "$AI"
          docker run --rm -v "$AI":/app.AppImage:Z fedora:40 bash -c '
            set -e
            dnf install -y --setopt=install_weak_deps=False --setopt=tsflags=nodocs xorg-x11-server-Xvfb mesa-dri-drivers libwayland-client libxkbcommon 2>&1 | tail -2
            xvfb-run -a /app.AppImage --appimage-extract-and-run >/tmp/app.log 2>&1 &
            PID=$!
            sleep 12
            if kill -0 $PID 2>/dev/null; then
              echo "APP STARTED OK on Fedora 40"
              if grep -qi "EGL_BAD_PARAMETER\|Could not create default EGL display\|Aborting" /tmp/app.log; then
                echo "EGL RENDERING ERROR DETECTED:"; grep -i "egl\|abort" /tmp/app.log | head; exit 1
              fi
              kill $PID
            else
              echo "LAUNCH FAILED on Fedora 40:"; tail -25 /tmp/app.log; exit 1
            fi
            wait $PID 2>/dev/null || true
          '
      - uses: actions/upload-artifact@v4
        with:
          name: timetable-linux
          path: build/timetable-x86_64.AppImage

  release:
    name: GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/timetable-windows-setup/*
            artifacts/timetable-linux/*
