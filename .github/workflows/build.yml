name: Build Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installer (.exe + WebView2, with CP-SAT)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install LLVM (clang-cl) and NSIS
        run: choco install llvm nsis -y
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build OR-Tools Windows C++ binding
        shell: bash
        run: bash scripts/build_ortools_windows.sh
      - name: Build Windows amd64 with -tags ortools
        shell: bash
        env:
          CGO_ENABLED: "1"
          CC: "gcc"
          MSYS_NO_PATHCONV: "1"
        run: |
          export PATH="/c/mingw64/bin:$PATH:$(go env GOPATH)/bin"
          wails build -platform windows/amd64 -tags ortools
          cp third_party/ortools_win/ortools_csat.dll build/bin/
          [ -f third_party/ortools_win/bin/ortools.dll ] && cp third_party/ortools_win/bin/ortools.dll build/bin/ || echo "no separate ortools.dll (statically linked)"
          CRT=$(find "/c/Program Files/Microsoft Visual Studio" -type d -name "Microsoft.VC143.CRT" 2>/dev/null | head -1)
          if [ -n "$CRT" ]; then
            find "$CRT" -maxdepth 1 -name '*.dll' -exec cp {} build/bin/ ';' && echo "copied MSVC CRT from $CRT" || echo "CRT copy skipped"
          fi
      - name: Stage installer files
        shell: bash
        run: |
          mkdir -p windows/staging
          cp build/bin/timetable.exe windows/staging/timetable.exe
          cp third_party/ortools_win/ortools_csat.dll windows/staging/ortools_csat.dll
          [ -f build/bin/ortools.dll ] && cp build/bin/ortools.dll windows/staging/ortools.dll
          for d in vcruntime140.dll vcruntime140_1.dll msvcp140.dll msvcp140_1.dll msvcp140_codecvt_ids.dll; do
            [ -f "build/bin/$d" ] && cp "build/bin/$d" windows/staging/
          done
          curl -L "https://go.microsoft.com/fwlink/?linkid=2124701" -o windows/staging/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
      - name: Build NSIS installer
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          makensis -DREPOROOT="${{ github.workspace }}" windows/installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: timetable-windows-setup
          path: build/timetable-setup-x64.exe

  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install WebView build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev librsvg2-dev pkg-config build-essential wget
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build OR-Tools C++ binding
        run: bash scripts/build_ortools.sh
      - name: Build Linux amd64 with -tags ortools
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ortools/lib
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -platform linux/amd64 -tags ortools
          cp -L third_party/ortools/lib/libortools.so* build/bin/
      - name: Build AppImage (single-file Linux package)
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          APP=build/AppDir
          rm -rf "$APP"; mkdir -p "$APP"
          cp build/bin/timetable "$APP/timetable"
          cp -L build/bin/libortools.so* "$APP/"
          ICON=build/appicon.png
          [ -f "$ICON" ] || ICON=frontend/src/assets/images/logo-universal.png
          if [ -f "$ICON" ]; then cp "$ICON" "$APP/timetable.png"; fi
          cat > "$APP/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE:$LD_LIBRARY_PATH"
          exec "$HERE/timetable" "$@"
          EOF
          chmod +x "$APP/AppRun" "$APP/timetable"
          cat > "$APP/timetable.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Timetable
          Exec=timetable
          Icon=timetable
          Comment=School timetable generator (CP-SAT)
          Categories=Education;
          EOF
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          /tmp/appimagetool "$APP" build/timetable-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: timetable-linux
          path: build/timetable-x86_64.AppImage

  release:
    name: GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/timetable-windows-setup/*
            artifacts/timetable-linux/*
